<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!--
      Everything between the markers is rewritten per route by server/og.ts, so
      a crawler that never runs the bundle still gets the right title, canonical
      and share card. The defaults below are the home page's — change them in
      server/og.ts as well, or the two will drift.
    -->
    <!--meta:start-->
    <title>RWA-ID | Identity for real-world asset platforms and client wallets</title>
    <meta name="description" content="Verifiable, ENS-compatible onchain identities for your clients — without touching KYC or internal ID systems. Non-custodial, resolvable on any chain, auditable by anyone." />
    <link rel="canonical" href="https://rwa-id.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RWA-ID" />
    <meta property="og:url" content="https://rwa-id.com/" />
    <meta property="og:title" content="RWA-ID | Identity for real-world asset platforms and client wallets" />
    <meta property="og:description" content="Verifiable, ENS-compatible onchain identities for your clients — without touching KYC or internal ID systems. Non-custodial, resolvable on any chain, auditable by anyone." />
    <meta property="og:image" content="https://rwa-id.com/og/home.png" />
    <meta property="og:image:secure_url" content="https://rwa-id.com/og/home.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RWA-ID — an identity card reading joe.yourfirm.rwa-id.eth resolving on six chains" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@rwa_ideth" />
    <meta name="twitter:title" content="RWA-ID | Identity for real-world asset platforms and client wallets" />
    <meta name="twitter:description" content="Verifiable, ENS-compatible onchain identities for your clients — without touching KYC or internal ID systems. Non-custodial, resolvable on any chain, auditable by anyone." />
    <meta name="twitter:image" content="https://rwa-id.com/og/home.png" />
    <meta name="twitter:image:alt" content="RWA-ID — an identity card reading joe.yourfirm.rwa-id.eth resolving on six chains" />
    <!--meta:end-->

    <meta name="keywords" content="decentralized identity, soulbound tokens, transferable NFT, Ethereum blockchain, RWA, real world assets, Web3 identity, ENS, Merkle proof, allowlist, verifiable credentials, client wallets" />
    <meta name="author" content="RWA-ID" />
    <meta name="theme-color" content="#F5F5F3" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
